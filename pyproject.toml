[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "small-trading-platform"
version = "0.1.0"
description = "PAPER-only modular trading engine foundation"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
small-trading-worker = "trading_engine.runtime:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
