name: Small Trading Engine Tests

on:
  push:
    branches:
      - rebuild/small-trading-foundation
  pull_request:
    branches:
      - rebuild/small-trading-foundation

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run safety and cycle tests
        run: python -m pytest -q

  dashboard-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check dashboard
        run: npm run typecheck
      - name: Run dashboard, broker, and risk regression tests
        run: npm test

  worker-container-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build observation worker image (no push)
        run: docker build --tag small-trading-worker:test .


  deployment-compose-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate two-service deployment configuration
        run: |
          cp .env.small-trading.example .env.small-trading
          docker compose -f docker-compose.small-trading.yml config --quiet


  render-blueprint-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Render Blueprint YAML syntax
        run: ruby -e "require 'yaml'; YAML.load_file('render.yaml')"
